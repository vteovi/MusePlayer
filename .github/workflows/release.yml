name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Rename APKs
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for f in app/build/outputs/apk/*/release/*.apk; do
            name=$(basename "$f" .apk)
            abi=${name#app-full-}
            if [ "$abi" != "$name" ]; then
              # 完整版带 libVLC 原生库，必须按 ABI 分发
              abi=${abi%-release}
              cp "$f" "out/MusePlayer_v${VERSION}_${abi}.apk"
              continue
            fi
            # 轻量版不含原生库，各 ABI 产物内容相同，只保留一个通用包
            if [ "$name" = "app-lite-arm64-v8a-release" ]; then
              cp "$f" "out/MusePlayer_Lite_v${VERSION}.apk"
            fi
          done
          ls -lh out
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusePlayer-v${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MusePlayer v${{ steps.apk.outputs.version }}
          files: out/*.apk
          generate_release_notes: true
